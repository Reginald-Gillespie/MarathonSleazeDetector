# Builds and publishes a GitHub release for every version tag:
#   git tag v0.9.1 && git push origin v0.9.1            stable release
#   git tag v0.9.2-preview && git push origin v0.9.2-preview   pre-release (preview channel)
# The release carries the Velopack installer (SleazeDetector-win-Setup.exe) and the update packages
# that installed copies download automatically (see src/SleazeDetector/Core/UpdateService.cs).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/SleazeDetector/SleazeDetector.csproj -c Release -o publish
          -p:Version=${{ steps.ver.outputs.version }}

      # ONNX Runtime's package also drops its import libraries next to the exe; they are only for C++ linking.
      - name: Remove import libraries
        shell: pwsh
        run: Remove-Item publish\*.lib -ErrorAction SilentlyContinue

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # The previous release, so the new one includes a small delta update next to the full package.
      - name: Download previous release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # first release

      - name: Pack
        run: >
          vpk pack --packId SleazeDetector --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish --mainExe SleazeDetector.exe --packTitle "Marathon Sleaze Detector"
          --icon src/SleazeDetector/Assets/app.ico

      # A tag with a suffix (v0.9.2-preview) is published as a pre-release: only copies with "Get preview versions"
      # on install it. A plain tag (v0.9.2) is a stable release for everyone.
      - name: Upload release
        shell: pwsh
        run: |
          $pre = @(if ('${{ github.ref_name }}'.Contains('-')) { '--pre' })
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} `
            --publish --releaseName "Marathon Sleaze Detector ${{ steps.ver.outputs.version }}" `
            --tag ${{ github.ref_name }} @pre

      # Only the installer and the update files stay. vpk always adds a portable zip, and RELEASES, an update index in
      # the older Squirrel format that this app does not read (it uses releases.win.json).
      - name: Remove the portable zip and the old-format update index
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($f in 'SleazeDetector-win-Portable.zip', 'RELEASES') {
            gh release delete-asset ${{ github.ref_name }} $f --repo ${{ github.repository }} --yes
          }
        continue-on-error: true
